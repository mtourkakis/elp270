async function open_(pw,silent){try{
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(S),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(I)},key,u(D));
 const html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
 try{localStorage.setItem('elp270_k',pw)}catch(e){}
 document.open();document.write(html);document.close();
}catch(e){try{localStorage.removeItem('elp270_k')}catch(_){} if(!silent)document.getElementById('e').textContent='Λάθος κωδικός';}}
