<title>PEL-FCL 270 · ELP application</title>
<style>
:root{--b:#0e3b7a;--b2:#1d5fbf;--bg:#eef2f7;--ink:#14213d;--mut:#5b6b82;--line:#d5dde8;--ok:#1a8f4c;--bad:#c0392b;--or:#e8892c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:760px;margin:0 auto;padding:0 12px calc(30px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 -12px 12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--b);color:#fff}
.top b{display:block;font-size:17px}.top span{display:block;font-size:12.5px;opacity:.85}
.top .btn.ghost{color:#fff;border-color:rgba(255,255,255,.5);background:transparent;width:auto}
.card{background:#fff;border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:0 1px 3px rgba(20,33,61,.08)}
.card.warn{background:#fff6e6;border:1px solid #f3c27a}
h2{font-size:16px;margin:0 0 10px;color:var(--b)}h2 small{font-weight:400;color:var(--mut);font-size:12.5px;margin-left:4px}
.hint{color:var(--mut);font-size:13px;margin:6px 0}.lbl{font-weight:600;font-size:14px;margin:12px 0 6px}
.decl{font-size:14px;background:#f5f8fc;border-left:3px solid var(--b2);padding:8px 10px;border-radius:6px}
.f{display:block;margin:0 0 10px}.f span{display:block;font-size:12.5px;color:var(--mut);margin:0 0 3px}.f span i{font-style:normal;opacity:.75}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fbfcfe;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--b2);border-color:transparent;background:#fff}
input.up{text-transform:uppercase}
.g2,.g3{display:grid;gap:0 10px;grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:520px){.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
.tblrow{border:1px solid var(--line);border-radius:10px;padding:10px 10px 0;margin:0 0 10px;display:grid;grid-template-columns:repeat(2,1fr);gap:0 10px;position:relative}
.tblrow>b{position:absolute;top:-9px;left:10px;background:#fff;padding:0 6px;font-size:12px;color:var(--mut)}
@media(min-width:640px){.tblrow{grid-template-columns:repeat(5,1fr)}}
.chk{display:flex;align-items:center;gap:10px;padding:9px 4px;font-size:15px}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--b2)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}@media(max-width:420px){.checks{grid-template-columns:1fr}}
.btn{display:block;width:100%;text-align:center;text-decoration:none;font:inherit;font-weight:600;font-size:16px;padding:12px 14px;margin:0 0 8px;border-radius:12px;border:1px solid var(--b2);background:#fff;color:var(--b2);cursor:pointer}
.btn.big{background:var(--b2);color:#fff;font-size:17px;padding:15px}.btn.alt{background:var(--or);border-color:var(--or);color:#fff}
.btn.ghost{border-color:var(--line);color:var(--ink)}.btn.small{font-size:14px;padding:7px 11px;margin:0}.btn.danger{color:var(--bad)}
.row{display:flex;justify-content:flex-end;margin-top:6px}
canvas.sig{width:100%;height:160px;border:2px dashed #9fb3cf;border-radius:12px;background:#fff;touch-action:none;display:block}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #eef1f5;flex-wrap:wrap}
.hrow>span{font-size:14.5px;min-width:150px}
.seg{display:flex;gap:4px}.seg button{width:40px;height:40px;border-radius:9px;border:1px solid var(--line);background:#f6f8fb;font:inherit;font-weight:700;color:var(--ink)}
.seg button.low{color:#a0412f}.seg button.on{background:var(--b2);border-color:var(--b2);color:#fff}.seg button.low.on{background:var(--bad);border-color:var(--bad)}
.ov{margin:10px 0;font-size:14px}.ov b{font-size:18px;color:var(--b)}
.tot div{background:#f3f6fa;border-radius:10px;padding:8px;text-align:center;font-size:13px;color:var(--mut);margin-bottom:10px}.tot b{display:block;font-size:24px;color:var(--b)}
.valid{font-weight:600;color:var(--ok);margin:4px 0 8px}.valid.bad{color:var(--bad)}
.err{background:#fdecea;border:1px solid #f5b7b1;color:#7b241c;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px}.err ul{margin:4px 0 0;padding-left:18px}
.item{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;text-align:left;font:inherit;background:#fff;border:0;border-bottom:1px solid #eef1f5;padding:11px 2px;color:var(--ink)}
.item small{display:block;color:var(--mut);font-size:12.5px}.item em{font-style:normal;font-size:12.5px;white-space:nowrap}
.search{margin-bottom:6px}
textarea.link{font-size:13px;height:84px;margin-bottom:10px}
.foot{text-align:center;color:var(--mut);font-size:12.5px}.foot a{color:var(--b2)}
.intro p{margin:4px 0}
.sigimg{max-width:100%;max-height:120px;display:block;border:1px solid var(--line);border-radius:10px;padding:6px;background:#fff}
.lock{background:#eef4ff;border:1px solid #c5d6f5;color:#1d3f7a;border-radius:10px;padding:8px 10px;font-size:13.5px;margin:0 0 10px}
input:disabled,textarea:disabled,select:disabled{background:#f1f3f6;color:#334;opacity:1;-webkit-text-fill-color:#334}
.seg button:disabled{opacity:.55}.seg button.on:disabled{opacity:1}
</style>
</head>

  const fit = (t, max, size) => { while (size > 5 && font.widthOfTextAtSize(t, size) > max) size -= 0.25; return size; };
  const text = (pg, t, x, top, maxX, size = 9, upper = true) => {
    t = pdfSafe(t).trim(); if (!t) return; if (upper) t = t.toUpperCase();
    const s = fit(t, maxX - x, size); pg.drawText(t, { x, y: H - top - 6.4, size: s, font, color: INK });
  };
  const cell = (pg, t, x0, x1, t0, t1, size = 8.5) => {
    t = pdfSafe(t).trim().toUpperCase(); if (!t) return;
    const s = fit(t, x1 - x0 - 4, size); const w = font.widthOfTextAtSize(t, s);
    pg.drawText(t, { x: (x0 + x1) / 2 - w / 2, y: H - (t0 + t1) / 2 - s * 0.35, size: s, font, color: INK });
  };
  const tick = (pg, b) => { const [x0, t0, x1, t1] = b, p = 2.8;
    pg.drawLine({ start: { x: x0 + p, y: H - t0 - p }, end: { x: x1 - p, y: H - t1 + p }, thickness: 1.6, color: INK });
    pg.drawLine({ start: { x: x0 + p, y: H - t1 + p }, end: { x: x1 - p, y: H - t0 - p }, thickness: 1.6, color: INK }); };
  const sig = async (pg, dataUrl, box) => {
    if (!dataUrl) return; const img = await doc.embedPng(dataUrl);
    const [x0, t0, x1, t1] = box, bw = x1 - x0, bh = t1 - t0; const sc = Math.min(bw / img.width, bh / img.height);
    pg.drawImage(img, { x: x0, y: H - t1, width: img.width * sc, height: img.height * sc });
  };
  const [p1, p2, p3] = pages;
  const c = d.cand || {};
  // Page 1
  const ref = pdfSafe(c.licRef || '').replace(/\s/g, '').toUpperCase().slice(0, 7);
  [...ref].forEach((ch, i) => { const x = L.p1.licRef[i] + 6.6 - font.widthOfTextAtSize(ch, 9) / 2; p1.drawText(ch, { x, y: H - 199.2, size: 9, font, color: INK }); });
  for (const [k, [x, t, mx]] of Object.entries(L.p1.text)) text(p1, c[k], x, t, mx, 9, k !== 'email');
  for (const [tbl, arr] of [[L.p1.lic, c.lic], [L.p1.prev, c.prevNone ? [{ date: 'NONE', state: 'NONE', examiner: 'NONE', authNo: 'NONE', result: 'NONE' }] : c.prev]])
    (arr || []).slice(0, 2).forEach((row, ri) => tbl.keys.forEach((k, ci) => cell(p1, row?.[k], tbl.cols[ci], tbl.cols[ci + 1], tbl.rows[ri][0], tbl.rows[ri][1])));
  for (const k of Object.keys(L.p1.checks)) if (c.apply?.[k]) tick(p1, L.p1.checks[k]);
  if (c.apply?.other && c.otherSpec) text(p1, c.otherSpec, L.p1.otherSpec[0], L.p1.otherSpec[1], L.p1.otherSpec[2], 7.5);
  // Page 2
  await sig(p2, c.sig, L.p2.sig);
  text(p2, c.sigDate, L.p2.date[0], L.p2.date[1], L.p2.date[2]);
  for (let i = 0; i < 3; i++) {
    const a = d.assess?.[i]; if (!a) continue; const o = L.p2.off[i];
    HEADS.forEach(([k], j) => cell(p2, a[k], L.p2.cols[j], L.p2.cols[j + 1], L.p2.res[0] + o, L.p2.res[1] + o, 11));
    const ov = overallOf(a); if (ov) text(p2, 'LEVEL ' + ov, L.p2.overall[0], L.p2.overall[1] + o, 566, 10);
    if (a.comments) {
      const words = pdfSafe(a.comments).split(' '); const lines = []; let cur = '';
      for (const w of words) { const t = cur ? cur + ' ' + w : w; if (font.widthOfTextAtSize(t, 7.5) > L.p2.comm[2] - L.p2.comm[0]) { lines.push(cur); cur = w; } else cur = t; }
      if (cur) lines.push(cur);
      lines.slice(0, 3).forEach((ln, li) => p2.drawText(ln, { x: L.p2.comm[0], y: H - (L.p2.comm[1] + o) - li * 9 - 2, size: 7.5, font, color: INK }));
    }
  }
  // Page 3
  [0, 1, 2].forEach(i => { const ov = overallOf(d.assess?.[i]); if (ov) cell(p3, ov, L.p3.cols[i], L.p3.cols[i + 1], L.p3.res[0], L.p3.res[1], 12); });
  const fin = d.final || finalOf(d);
  if (fin) { const t = 'ICAO LEVEL ' + fin; p3.drawText(t, { x: L.p3.final[0], y: H - (L.p3.final[1] + L.p3.final[2]) / 2 - 5, size: 14, font, color: INK }); }
  const ex = d.exam || {};
  if (ex.idType === 'dl') { tick(p3, L.p3.dl); text(p3, ex.idState, ...L.p3.dlState.slice(0, 2), L.p3.dlState[2]); text(p3, ex.idNo, L.p3.dlNo[0], L.p3.dlNo[1], L.p3.dlNo[2]); }
  if (ex.idType === 'pp') { tick(p3, L.p3.pp); text(p3, ex.idState, L.p3.ppState[0], L.p3.ppState[1], L.p3.ppState[2]); text(p3, ex.idNo, L.p3.ppNo[0], L.p3.ppNo[1], L.p3.ppNo[2]); }
  await sig(p3, ex.sig, L.p3.sig);
  text(p3, ex.date, L.p3.date[0], L.p3.date[1], L.p3.date[2]);
  text(p3, ex.name, L.p3.exName[0], L.p3.exName[1], L.p3.exName[2]);
  text(p3, ex.no, L.p3.exNo[0], L.p3.exNo[1], L.p3.exNo[2]);
  // embed data so the examiner app can re-import it
  if (embed) doc.getInfoDict().set(PDFName.of('ELP270Data'), PDFHexString.fromText(JSON.stringify(d)));
  doc.setTitle('PEL-FCL 270 ELP - ' + pdfSafe((c.surname || '') + ' ' + (c.first || '')).trim());
  doc.setProducer('ELP 270 app');
  return await doc.save();
}

async function readPdfData(bytes) {
  const doc = await PDFDocument.load(bytes, { updateMetadata: false });
  const v = doc.getInfoDict().lookup(PDFName.of('ELP270Data'));
  if (!v) return null;
  return JSON.parse(v.decodeText());
}

function fileName(d, suffix) { const c = d.cand || {}; return ('PEL-FCL-270_' + pdfSafe((c.surname || 'CANDIDATE') + '_' + (c.first || '')).toUpperCase().replace(/[^A-Z0-9_]+/g, '_') + (suffix ? '_' + suffix : '')).replace(/_+$/, '') + '.pdf'; }

async function deliver(bytes, name, opts = {}) {
  const file = new File([bytes], name, { type: 'application/pdf' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name, text: opts.text || '' }); return 'shared'; }
    catch (e) { if (e.name === 'AbortError') return 'aborted'; }
  }
  const url = URL.createObjectURL(file); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000); return 'downloaded';
}
async function previewPdf(bytes) {
  const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
  const w = window.open(url, '_blank'); if (!w) location.href = url;
}

/* ---------- signature pad ---------- */
function sigPad(host, initial, onChange) {
  host.innerHTML = '<canvas class="sig"></canvas><div class="row"><button type="button" class="btn small ghost clr">Clear / Καθαρισμός</button></div>';
  const cv = $('canvas', host), ctx = cv.getContext('2d'); let drawing = false, dirty = !!initial, last = null;
  const size = () => { const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1; cv.width = r.width * dpr; cv.height = r.height * dpr; ctx.scale(dpr, dpr); ctx.lineWidth = 2.2; ctx.lineCap = ctx.lineJoin = 'round'; ctx.strokeStyle = '#0d1a73';
    if (initial && dirty) { const im = new Image(); im.onload = () => { const s = Math.min(r.width / im.width, r.height / im.height); ctx.drawImage(im, 0, 0, im.width * s, im.height * s); }; im.src = initial; } };
  requestAnimationFrame(size);
  const pos = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  cv.addEventListener('pointerdown', e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); drawing = true; last = pos(e); ctx.beginPath(); ctx.arc(last.x, last.y, 1, 0, 7); ctx.fillStyle = '#0d1a73'; ctx.fill(); });
  cv.addEventListener('pointermove', e => { if (!drawing) return; e.preventDefault(); const p = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; dirty = true; });
  const end = () => { if (!drawing) return; drawing = false; initial = exportSig(); onChange(initial); };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  $('.clr', host).onclick = () => { ctx.clearRect(0, 0, cv.width, cv.height); dirty = false; initial = ''; onChange(''); };
  function exportSig() {
    const w = cv.width, h = cv.height, data = ctx.getImageData(0, 0, w, h).data; let x0 = w, y0 = h, x1 = 0, y1 = 0;
    for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) if (data[(y * w + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    if (x1 <= x0) return '';
    x0 = Math.max(0, x0 - 6); y0 = Math.max(0, y0 - 6); x1 = Math.min(w, x1 + 6); y1 = Math.min(h, y1 + 6);
    const sc = Math.min(1, 700 / (x1 - x0)); const o = document.createElement('canvas'); o.width = Math.round((x1 - x0) * sc); o.height = Math.round((y1 - y0) * sc);
    o.getContext('2d').drawImage(cv, x0, y0, x1 - x0, y1 - y0, 0, 0, o.width, o.height); return o.toDataURL('image/png');
  }
}

    const set = () => { const path = el.dataset.k.split('.'); let o = obj; for (let i = 0; i < path.length - 1; i++) { o = o[path[i]] ??= (/^\d+$/.test(path[i + 1]) ? [] : {}); } o[path.at(-1)] = el.type === 'checkbox' ? el.checked : el.value; obj.__changed && obj.__changed(); };

function wireCandidate(root, d) {
  const c = d.cand; bindAll(root, c);
  root.querySelectorAll('input.up').forEach(el => el.addEventListener('input', () => { const p = el.selectionStart; el.value = el.value.toUpperCase(); try { el.setSelectionRange(p, p); } catch (e) {} el.dispatchEvent(new Event('change')); }));
  root.querySelectorAll('input.date').forEach(el => el.addEventListener('blur', () => { const m = /^(\d{1,2})[\/.\-\s](\d{1,2})[\/.\-\s](\d{2,4})$/.exec(el.value.trim()); if (m) { let y = m[3]; if (y.length === 2) y = (+y > 30 ? '19' : '20') + y; el.value = pad(m[1]) + '/' + pad(m[2]) + '/' + y; el.dispatchEvent(new Event('change')); } }));
  const none = root.querySelector('[data-k="prevNone"]'); none.addEventListener('change', () => { $('#prevRows', root).hidden = none.checked; });

function candidateErrors(c) {
  const e = [];
  if (!c.surname) e.push('Surname'); if (!c.first) e.push('First name'); if (!/^\d{2}\/\d{2}\/\d{4}$/.test(c.dob || '')) e.push('Date of birth (dd/mm/yyyy)');
  if (!c.nationality) e.push('Nationality'); if (!c.addr1) e.push('Permanent address'); if (!c.mobile) e.push('Mobile tel.');
  if (!/^\S+@\S+\.\S+$/.test(c.email || '')) e.push('E-mail');
  if (!c.prevNone && !(c.prev || []).some(r => r && Object.values(r).some(Boolean))) e.push('Section 3 – fill in or tick NONE');

/* ---------- views ---------- */
const app = $('#app');
function view(html) { app.innerHTML = html; window.scrollTo(0, 0); }

function parseLink() {
  const h = location.hash.slice(1); if (!h) return null;
  const m = /(?:^|&)c=([^&]+)/.exec(h);
  if (m) { try { return JSON.parse(unb64u(m[1])); } catch (e) { return { bad: true }; } }
  const p = h.split('~'); if (p.length < 2 || !/^[a-z0-9]{6,}$/i.test(p[0])) return { bad: true };
  try { return { id: p[0], ex: decodeURIComponent(p[1]).replace(/_/g, ' '), mail: p[2] ? decodeURIComponent(p[2]) : '' }; } catch (e) { return { bad: true }; }
}

  $('#send').onclick = async () => {
    const er = candidateErrors(d.cand);
    if (er.length) { $('#errs').innerHTML = '<div class="err"><b>Please complete:</b><ul>' + er.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>'; $('#errs').scrollIntoView({ behavior: 'smooth' }); return; }
    $('#errs').innerHTML = '';
    d.status = 'returned'; d.candSubmitted = new Date().toISOString(); persist();
    const bytes = await buildPdf(clean(d), true); const name = fileName(d);
    const r = await deliver(bytes, name, { text: 'PEL-FCL 270 – ' + d.cand.surname + ' ' + d.cand.first });
    const mail = inv.mail ? `mailto:${encodeURIComponent(inv.mail)}?subject=${encodeURIComponent('PEL-FCL 270 ELP – ' + d.cand.surname + ' ' + d.cand.first)}&body=${encodeURIComponent('Please find attached my completed PEL-FCL 270 form (' + name + ').')}` : '';
    $('#after').innerHTML = r === 'shared' ? '✅ Sent. Thank you! / Εστάλη, ευχαριστούμε!' :
      `The PDF <b>${esc(name)}</b> was saved to your device. Please send it to your examiner${inv.mail ? ` by e-mail: <a href="${mail}">${esc(inv.mail)}</a> (attach the PDF)` : ''}${inv.wa ? ` or WhatsApp: <a href="https://wa.me/${esc(inv.wa.replace(/\D/g, ''))}">${esc(inv.wa)}</a>` : ''}.`;
  };
}
function clean(d) { return JSON.parse(JSON.stringify(d, (k, v) => k === '__changed' ? undefined : v)); }

function homeView(){}
/* ---------- start ---------- */
const inv = parseLink();
if (MODE === 'client') {
  if (inv) candidateView(inv);
  else view('<header class="top cand"><div><b>PEL-FCL 270</b><span>English Language Proficiency (ELP)</span></div></header><div class="card"><h2>Please use the link sent by your examiner</h2><p>This page opens only from the personal link your examiner sent you (e-mail, WhatsApp or SMS).</p><p class="hint">Η σελίδα ανοίγει μόνο από το προσωπικό link που σας έστειλε ο εξεταστής.</p></div>');
  window.addEventListener('hashchange', () => location.reload());
} else homeView();
window.__ELP = { buildPdf, readPdfData, overallOf, finalOf };
})();
</script>
